<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GE Forms — PNGUOT GEMS</title>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
<div id="app-shell">
  <!-- Sidebar (shared) -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-avatar" id="sidebar-footer-av">JD</div>
      <div class="sidebar-workspace">
        <div class="ws-name" id="sidebar-ws-name">Loading…</div>
        <div class="ws-sub"  id="sidebar-ws-sub">PNGUOT</div>
      </div>
      <button class="sidebar-add-btn" onclick="window.location.href='ge-form.html'" title="New GE">+</button>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" data-page="dashboard.html"    href="dashboard.html"><span class="nav-icon">📊</span><span class="nav-label">Overview</span></a>
      <a class="nav-item" data-page="notifications.html" href="notifications.html"><span class="nav-icon">🔔</span><span class="nav-label">Notifications</span><span class="nav-badge hidden notif-badge">0</span></a>
      <div class="sidebar-section-label">Expenses</div>
      <a class="nav-item" data-page="ge-form.html"      href="ge-form.html"><span class="nav-icon">➕</span><span class="nav-label">New GE</span></a>
      <a class="nav-item" data-page="my-ges.html"       href="my-ges.html"><span class="nav-icon">📋</span><span class="nav-label">My GE Forms</span></a>
      <a class="nav-item" data-page="quotation-tracker.html" href="quotation-tracker.html"><span class="nav-icon">📎</span><span class="nav-label">Quotation Tracker</span></a>
      <div class="sidebar-section-label approver-only hidden">Approvals</div>
      <a class="nav-item approver-only hidden" data-page="approvals.html" href="approvals.html"><span class="nav-icon">✅</span><span class="nav-label">Pending Approvals</span></a>
      <div class="sidebar-section-label admin-only hidden">Administration</div>
      <a class="nav-item admin-only hidden" data-page="admin-users.html"     href="admin-users.html"><span class="nav-icon">👥</span><span class="nav-label">Users</span></a>
      <a class="nav-item admin-only hidden" data-page="admin-delegates.html" href="admin-delegates.html"><span class="nav-icon">🔗</span><span class="nav-label">Delegates</span></a>
      <a class="nav-item admin-only hidden" data-page="admin-reports.html"   href="admin-reports.html"><span class="nav-icon">📈</span><span class="nav-label">Reports</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="footer-icon">💰</div>
      <div><div class="footer-name" id="sidebar-footer-name">PNGUOT GEMS</div><div class="footer-version">ver. 1.0.0</div></div>
      <div class="dropdown">
        <button class="footer-menu" data-dropdown="sidebar-user-menu">•••</button>
        <div class="dropdown-menu" id="sidebar-user-menu">
          <div class="dropdown-item" onclick="location.href='profile.html'">👤 Profile</div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-item danger" onclick="Auth.logout()">🚪 Sign Out</div>
        </div>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div id="main-area">
    <header id="topbar">
      <button class="hamburger" id="hamburger-btn">☰</button>
      <span class="topbar-page-title">My GE Forms</span>
      <div class="topbar-search">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Search GE, payee, reference…" id="search-input">
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="window.location.href='ge-form.html'">+ New GE</button>
        <div class="topbar-user dropdown" data-dropdown="user-menu">
          <div class="user-avatar" id="topbar-avatar">JD</div>
          <div><div class="user-name" id="topbar-user-name">…</div><div class="user-role" id="topbar-user-role"></div></div>
        </div>
        <div class="dropdown-menu" id="user-menu">
          <div class="dropdown-item danger" onclick="Auth.logout()">🚪 Sign Out</div>
        </div>
      </div>
    </header>

    <main id="page-content">
      <!-- Filter bar -->
      <div class="card mb-24">
        <div class="card-body" style="padding:12px 16px">
          <div class="flex-between flex-wrap gap-8">
            <div class="flex gap-8 flex-wrap">
              <select class="form-control" id="filter-status" style="width:auto">
                <option value="">All Statuses</option>
                <option value="DRAFT">Draft</option>
                <option value="READY_FOR_DOCUMENTS">Ready for Documents</option>
                <option value="SUBMITTED">Submitted</option>
                <option value="PENDING_HOS">Pending HOS</option>
                <option value="PENDING_DEAN">Pending Dean</option>
                <option value="PENDING_ICT">Pending ICT</option>
                <option value="PENDING_PROCUREMENT">Pending Procurement</option>
                <option value="PENDING_ACCOUNTS_VERIFICATION">Pending Accounts</option>
                <option value="PENDING_VC">Pending VC</option>
                <option value="PENDING_PAYMENT">Pending Payment</option>
                <option value="QUERIED">Queried</option>
                <option value="COMPLETED">Completed</option>
                <option value="CANCELLED">Cancelled</option>
              </select>
            </div>
            <div id="total-count" class="text-muted" style="font-size:13px"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div id="ge-list-container">
          <div class="page-loader"><div class="spinner"></div> Loading…</div>
        </div>
        <div id="pagination-container"></div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script>
let currentPage = 1;
let searchTimer;

(async () => {
  const ok = await requireAuth();
  if (!ok) return;
  Sidebar.setActive('my-ges.html');
  loadList();
  document.getElementById('filter-status').addEventListener('change', () => { currentPage=1; loadList(); });
  document.getElementById('search-input').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { currentPage=1; loadList(); }, 400);
  });
})();

async function loadList() {
  const container = document.getElementById('ge-list-container');
  container.innerHTML = `<div class="page-loader"><div class="spinner"></div></div>`;
  try {
    const res = await API.geList({
      page:   currentPage,
      limit:  20,
      status: document.getElementById('filter-status').value,
      search: document.getElementById('search-input').value,
    });
    const { data, pagination } = res;
    document.getElementById('total-count').textContent = `${pagination.total} GE form${pagination.total!=1?'s':''}`;

    if (!data.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="es-icon">📋</div>
          <div class="es-title">No GE forms found</div>
          <div class="es-sub">Create your first GE form to get started.</div>
          <div style="margin-top:16px"><a href="ge-form.html" class="btn btn-primary">+ New GE Form</a></div>
        </div>`;
      document.getElementById('pagination-container').innerHTML = '';
      return;
    }

    container.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>GE Number</th><th>Payee</th><th>Dept Ref</th>
              <th>Type</th><th>Amount</th><th>Status</th><th>Updated</th><th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${data.map(g => `
              <tr>
                <td><span class="font-mono fw-600">${g.ge_number||'—'}</span></td>
                <td>${g.payee_name||'—'}</td>
                <td class="font-mono">${g.departmental_reference||'—'}</td>
                <td>${g.procurement_type}${g.is_capital_item?' 🏛':''}
                </td>
                <td class="fw-600">${Fmt.currency(g.total_amount)}</td>
                <td>${statusBadge(g.status, g.status_label)}</td>
                <td>${Fmt.date(g.updated_at)}</td>
                <td>
                  <div class="flex gap-8">
                    ${['DRAFT','READY_FOR_DOCUMENTS','QUERIED'].includes(g.status)
                      ? `<a href="ge-form.html?id=${g.id}" class="btn btn-secondary btn-sm">Edit</a>`
                      : `<a href="ge-view.html?id=${g.id}" class="btn btn-ghost btn-sm">View</a>`}
                    ${g.status==='READY_FOR_DOCUMENTS'
                      ? `<a href="ge-documents.html?id=${g.id}" class="btn btn-primary btn-sm">Documents</a>` : ''}
                  </div>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;

    // Pagination
    renderPagination(pagination);
  } catch (err) {
    container.innerHTML = `<div class="alert alert-error" style="margin:16px"><span>❌</span>${err.message}</div>`;
  }
}

function renderPagination(p) {
  const c = document.getElementById('pagination-container');
  if (p.pages <= 1) { c.innerHTML=''; return; }
  let html = `<div class="pagination">`;
  html += `<button class="page-btn" onclick="goPage(${p.page-1})" ${p.page<=1?'disabled':''}>‹</button>`;
  for (let i=1; i<=p.pages; i++) {
    if (i===1||i===p.pages||Math.abs(i-p.page)<=2)
      html += `<button class="page-btn ${i===p.page?'active':''}" onclick="goPage(${i})">${i}</button>`;
    else if (Math.abs(i-p.page)===3) html += `<span class="page-btn" style="border:none">…</span>`;
  }
  html += `<button class="page-btn" onclick="goPage(${p.page+1})" ${p.page>=p.pages?'disabled':''}>›</button>`;
  c.innerHTML = html + '</div>';
}
function goPage(p) { currentPage=p; loadList(); }
</script>
</body>
</html>
