    </main>

<script src="../assets/js/api.js?v=2"></script>
<script src="../assets/js/app.js"></script>
<script>
const NOTIF_ICONS = {
  APPROVAL_REQUIRED: '🔔', GE_QUERIED: '❓', QUERY_RESPONDED: '💬',
  GE_COMPLETED: '✅', GE_REJECTED: '❌', QUERY_RAISED: '❓', default: 'ℹ️',
};

(async () => {
  const ok = await requireAuth(['SYSTEM_ADMIN']);
  if (!ok) return;
  Sidebar.setActive('admin-notifications.html');
  loadNotifications();
})();

async function loadNotifications() {
  const c = document.getElementById('notif-list');
  try {
    const res   = await API.notifications();
    const notes = res.notifications;
    if (!notes.length) {
      c.innerHTML = `<div class="empty-state"><div class="es-icon">🔔</div><div class="es-title">No notifications</div></div>`;
      return;
    }
    c.innerHTML = notes.map(n => `
      <div class="doc-item" style="${!n.is_read ? 'background:var(--primary-light)' : ''};cursor:pointer"
           onclick="markRead(${n.id}, this)">
        <span class="doc-icon">${NOTIF_ICONS[n.type] || NOTIF_ICONS.default}</span>
        <div class="doc-info">
          <div class="doc-name">
            ${n.ge_number ? `<span class="font-mono" style="margin-right:6px">${n.ge_number}</span>` : ''}
            ${n.type.replace(/_/g,' ')}
            ${!n.is_read ? '<span class="nav-badge" style="display:inline-flex;margin-left:6px">New</span>' : ''}
          </div>
          <div class="doc-meta">${n.message}</div>
          <div class="doc-meta">${Fmt.datetime(n.created_at)}</div>
        </div>
        ${n.ge_number ? `<a href="admin-all-ges.html" class="btn btn-ghost btn-sm">View GE →</a>` : ''}
      </div>`).join('');
  } catch (err) {
    c.innerHTML = `<div class="alert alert-error" style="margin:16px"><span>❌</span>${err.message}</div>`;
  }
}

async function markRead(id, el) {
  try {
    await API.markNotifRead({ id });
    el.style.background = '';
    el.querySelector('.nav-badge')?.remove();
  } catch {}
}

async function markAllRead() {
  try {
    await API.markNotifRead({ mark_read_all: true });
    Toast.success('All notifications marked as read.');
    loadNotifications();
  } catch (err) { Toast.error(err.message); }
}
</script>
</body>
