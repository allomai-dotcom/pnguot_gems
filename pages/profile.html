<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — PNGUOT GEMS</title>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="staff-ui">
<div id="app-shell">
  <!-- Staff Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-avatar" id="sidebar-footer-av">JD</div>
      <div class="sidebar-workspace"><div class="ws-name" id="sidebar-ws-name">—</div><div class="ws-sub" id="sidebar-ws-sub">PNGUOT</div></div>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html" data-page="dashboard.html"><span class="nav-icon">📊</span><span class="nav-label">Overview</span></a>
      <a class="nav-item" href="notifications.html" data-page="notifications.html"><span class="nav-icon">🔔</span><span class="nav-label">Notifications</span><span class="nav-badge hidden notif-badge">0</span></a>
      <div class="sidebar-section-label">Expenses</div>
      <a class="nav-item" href="ge-form.html" data-page="ge-form.html"><span class="nav-icon">➕</span><span class="nav-label">New GE</span></a>
      <a class="nav-item" href="my-ges.html"  data-page="my-ges.html"><span class="nav-icon">📋</span><span class="nav-label">My GE Forms</span></a>
      <a class="nav-item" href="quotation-tracker.html" data-page="quotation-tracker.html"><span class="nav-icon">📎</span><span class="nav-label">Quotation Tracker</span></a>
      <a class="nav-item" href="my-reports.html" data-page="my-reports.html"><span class="nav-icon">📊</span><span class="nav-label">Reports</span></a>
      <div class="sidebar-section-label approver-only hidden">Approvals</div>
      <a class="nav-item approver-only hidden" href="approvals.html" data-page="approvals.html"><span class="nav-icon">✅</span><span class="nav-label">Pending Approvals</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="footer-icon" style="background:none;padding:0"><img src="../assets/img/pnguot-logo.jpg" style="width:42px;height:42px;object-fit:contain;border-radius:4px"></div>
      <div><div class="footer-name" id="sidebar-footer-name">PNGUOT GEMS</div><div class="footer-version">ver. 1.0</div></div>
      <div class="dropdown"><button class="footer-menu" data-dropdown="sidebar-user-menu">•••</button>
        <div class="dropdown-menu" id="sidebar-user-menu">
          <div class="dropdown-item" onclick="window.location.href='profile.html'">👤 My Profile</div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-item danger" onclick="Auth.logout()">🚪 Sign Out</div>
        </div>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div id="main-area">
    <header id="topbar">
      <button class="hamburger" id="hamburger-btn">☰</button>
      <span class="topbar-page-title">My Profile</span>
      <div class="topbar-actions" style="margin-left:auto">
        <div class="user-avatar" id="topbar-avatar">JD</div>
        <div><div class="user-name" id="topbar-user-name">—</div><div class="user-role" id="topbar-user-role"></div></div>
      </div>
    </header>

    <main id="page-content">
      <div style="max-width:560px">
        <div class="card mb-24">
          <div class="card-header"><span class="card-title">Profile Information</span></div>
          <div class="card-body">
            <div class="flex-center gap-8 mb-16" style="gap:16px">
              <div style="width:64px;height:64px;background:var(--primary);border-radius:50%;
                          display:flex;align-items:center;justify-content:center;
                          font-size:24px;font-weight:700;color:#fff" id="profile-avatar">JD</div>
              <div>
                <div id="profile-name" class="fw-700" style="font-size:18px"></div>
                <div id="profile-staff-id" class="font-mono text-muted"></div>
              </div>
            </div>
            <table style="width:100%;font-size:13px;border-collapse:collapse">
              <tr><td style="padding:8px 0;color:var(--text-muted);width:130px">Email</td><td id="profile-email" class="fw-600"></td></tr>
              <tr><td style="padding:8px 0;color:var(--text-muted)">Department</td><td id="profile-dept" class="fw-600"></td></tr>
              <tr><td style="padding:8px 0;color:var(--text-muted)">Phone</td><td id="profile-phone" class="fw-600"></td></tr>
              <tr><td style="padding:8px 0;color:var(--text-muted)">Roles</td><td id="profile-roles"></td></tr>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><span class="card-title">Change Password</span></div>
          <div class="card-body">
            <div id="pw-alert" class="hidden mb-16"></div>
            <div class="form-group">
              <label class="form-label">Current Password <span class="required">*</span></label>
              <input id="pw-current" type="password" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label">New Password <span class="required">*</span></label>
              <input id="pw-new" type="password" class="form-control">
              <span class="form-hint">Minimum 8 characters</span>
            </div>
            <div class="form-group">
              <label class="form-label">Confirm New Password <span class="required">*</span></label>
              <input id="pw-confirm" type="password" class="form-control">
            </div>
            <button class="btn btn-primary" onclick="changePassword()">Update Password</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/api.js?v=2"></script>
<script src="../assets/js/app.js?v=2"></script>
<script>
(async () => {
  const ok = await requireAuth();
  if (!ok) return;
  const u = Auth.user;
  const initials = ((u.first_name?.[0]||'')+(u.last_name?.[0]||'')).toUpperCase();
  document.getElementById('profile-avatar').textContent   = initials;
  document.getElementById('profile-name').textContent     = `${u.first_name} ${u.last_name}`;
  document.getElementById('profile-staff-id').textContent = u.staff_id;
  document.getElementById('profile-email').textContent    = u.email;
  document.getElementById('profile-dept').textContent     = u.dept_name || '—';
  document.getElementById('profile-phone').textContent    = u.phone || '—';
  document.getElementById('profile-roles').innerHTML =
    (u.roles||[]).map(r => `<span class="status-badge status-SUBMITTED" style="margin:2px">${r.replace(/_/g,' ')}</span>`).join('');
})();

async function changePassword() {
  const alertEl = document.getElementById('pw-alert');
  const current = document.getElementById('pw-current').value;
  const newPw   = document.getElementById('pw-new').value;
  const confirm = document.getElementById('pw-confirm').value;
  alertEl.className = 'hidden mb-16';

  if (!current || !newPw || !confirm) {
    alertEl.className = 'alert alert-warning mb-16';
    alertEl.innerHTML = '<span>⚠️</span> All fields are required.'; return;
  }
  if (newPw !== confirm) {
    alertEl.className = 'alert alert-warning mb-16';
    alertEl.innerHTML = '<span>⚠️</span> New passwords do not match.'; return;
  }
  if (newPw.length < 8) {
    alertEl.className = 'alert alert-warning mb-16';
    alertEl.innerHTML = '<span>⚠️</span> Password must be at least 8 characters.'; return;
  }
  try {
    await API.changePassword({ current_password: current, new_password: newPw });
    alertEl.className = 'alert alert-success mb-16';
    alertEl.innerHTML = '<span>✅</span> Password changed successfully.';
    document.getElementById('pw-current').value = '';
    document.getElementById('pw-new').value     = '';
    document.getElementById('pw-confirm').value = '';
  } catch (err) {
    alertEl.className = 'alert alert-error mb-16';
    alertEl.innerHTML = `<span>❌</span> ${err.message}`;
  }
}
</script>
</body>
</html>
