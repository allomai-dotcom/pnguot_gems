<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — PNGUOT GEMS</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    .dash-welcome {
      background: linear-gradient(135deg, #1e3a5f 0%, #1d4ed8 60%, #0ea5e9 100%);
      border-radius: var(--card-radius);
      padding: 20px 24px;
      margin-bottom: 24px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .dash-welcome img { width: 52px; height: 52px; object-fit: contain; border-radius: 8px; flex-shrink: 0; }
    .dash-welcome-text h2 { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
    .dash-welcome-text p  { font-size: 12px; opacity: .8; }
    .dash-welcome-date { margin-left: auto; text-align: right; flex-shrink: 0; }
    .dash-welcome-date .date-day  { font-size: 22px; font-weight: 700; }
    .dash-welcome-date .date-full { font-size: 11px; opacity: .75; }

    .stat-card { border-left: 4px solid var(--card-border); transition: transform .15s, box-shadow .15s; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    .stat-card.sc-blue   { border-left-color: #3b82f6; }
    .stat-card.sc-green  { border-left-color: #22c55e; }
    .stat-card.sc-yellow { border-left-color: #f59e0b; }
    .stat-card.sc-purple { border-left-color: #8b5cf6; }
    .stat-card.sc-teal   { border-left-color: #14b8a6; }
    .stat-card.sc-orange { border-left-color: #f97316; }
    .stat-card.sc-blue   .stat-icon { background: #eff6ff; color: #2563eb; }
    .stat-card.sc-green  .stat-icon { background: #f0fdf4; color: #16a34a; }
    .stat-card.sc-yellow .stat-icon { background: #fffbeb; color: #d97706; }
    .stat-card.sc-purple .stat-icon { background: #f5f3ff; color: #7c3aed; }
    .stat-card.sc-teal   .stat-icon { background: #f0fdfa; color: #0d9488; }
    .stat-card.sc-orange .stat-icon { background: #fff7ed; color: #ea580c; }

    .quick-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
    .qa-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
      text-decoration: none; border: 1.5px solid transparent; transition: all .15s; cursor: pointer;
    }
    .qa-btn.primary { background: #3b82f6; color: #fff; }
    .qa-btn.primary:hover { background: #2563eb; }
    .qa-btn.ghost { background: var(--card-bg); border-color: var(--card-border); color: var(--text-primary); }
    .qa-btn.ghost:hover { border-color: #3b82f6; color: #3b82f6; background: #eff6ff; }

    .dash-section-title {
      font-size: 13px; font-weight: 700; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: .05em;
      margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid var(--card-border);
    }

    .sidebar-logout-btn {
      display: flex; align-items: center; gap: 8px;
      width: 100%; margin-top: 8px; padding: 8px 12px;
      background: rgba(239,68,68,.1); color: #ef4444;
      border: 1px solid rgba(239,68,68,.25); border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .sidebar-logout-btn:hover { background: rgba(239,68,68,.2); border-color: rgba(239,68,68,.5); }
  </style>
</head>
<body class="staff-ui">
<div id="app-shell">

  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-avatar" id="sidebar-footer-av">JD</div>
      <div class="sidebar-workspace">
        <div class="ws-name" id="sidebar-ws-name">Loading</div>
        <div class="ws-sub" id="sidebar-ws-sub">PNGUOT</div>
      </div>
      <button class="sidebar-add-btn" onclick="window.location.href='ge-form.html'" title="New GE">+</button>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item" data-page="dashboard.html" href="dashboard.html">
        <span class="nav-icon">🏠</span><span class="nav-label">Overview</span>
      </a>
      <a class="nav-item" data-page="notifications.html" href="notifications.html">
        <span class="nav-icon">🔔</span><span class="nav-label">Notifications</span>
        <span class="nav-badge hidden notif-badge">0</span>
      </a>

      <div class="sidebar-section-label">Expenses</div>
      <a class="nav-item" data-page="ge-form.html" href="ge-form.html">
        <span class="nav-icon">➕</span><span class="nav-label">New GE</span>
      </a>
      <a class="nav-item" data-page="my-ges.html" href="my-ges.html">
        <span class="nav-icon">📋</span><span class="nav-label">My GE Forms</span>
      </a>
      <a class="nav-item" data-page="my-ges.html?status=DRAFT" href="my-ges.html?status=DRAFT">
        <span class="nav-icon">📝</span><span class="nav-label">Drafts</span><span class="nav-badge hidden draft-count">0</span>
      </a>
      <a class="nav-item" data-page="quotation-tracker.html" href="quotation-tracker.html">
        <span class="nav-icon">📊</span><span class="nav-label">Quotation Tracker</span>
      </a>
      <a class="nav-item" data-page="my-reports.html" href="my-reports.html">
        <span class="nav-icon">📈</span><span class="nav-label">Reports</span>
      </a>

      <div class="sidebar-section-label approver-only hidden">Approvals</div>
      <a class="nav-item approver-only hidden" data-page="approvals.html" href="approvals.html">
        <span class="nav-icon">✅</span><span class="nav-label">Pending Approvals</span>
        <span class="nav-badge hidden" id="pending-approvals-badge">0</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="footer-icon" style="background:none;padding:0"><img src="../assets/img/pnguot-logo.jpg" style="width:42px;height:42px;object-fit:contain;border-radius:4px"></div>
      <div>
        <div class="footer-name" id="sidebar-footer-name">PNGUOT GEMS</div>
        <div class="footer-version">ver. 1.0</div>
      </div>
      <div style="margin-left:auto">
        <div class="dropdown-item" onclick="window.location.href='profile.html'" style="cursor:pointer;font-size:12px;padding:4px 8px">👤 Profile</div>
      </div>
    </div>
    <button class="sidebar-logout-btn" onclick="Auth.logout()">🚪 Sign Out</button>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div id="main-area">
    <header id="topbar">
      <button class="hamburger" id="hamburger-btn">☰</button>
      <span class="topbar-page-title">Overview</span>
      <div class="topbar-search">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Search GE number, payee" id="dash-search" name="dash-search">
      </div>
      <div class="topbar-actions">
        <div class="dropdown">
          <button class="topbar-btn" data-dropdown="notif-dropdown" title="Notifications">
            🔔<span class="badge hidden notif-badge">0</span>
          </button>
          <div class="dropdown-menu" id="notif-dropdown" style="min-width:300px">
            <div style="padding:10px 14px;font-weight:600;font-size:13px;border-bottom:1px solid var(--card-border)">Notifications</div>
            <div id="notif-preview-list" style="max-height:260px;overflow-y:auto"></div>
            <div style="padding:8px;border-top:1px solid var(--card-border)">
              <a href="notifications.html" class="btn btn-ghost btn-sm w-full" style="justify-content:center">View All</a>
            </div>
          </div>
        </div>
        <div class="dropdown">
          <div class="topbar-user" data-dropdown="user-menu">
            <div class="user-avatar" id="topbar-avatar">JD</div>
            <div>
              <div class="user-name" id="topbar-user-name">Loading</div>
              <div class="user-role" id="topbar-user-role"></div>
            </div>
          </div>
          <div class="dropdown-menu" id="user-menu">
            <div class="dropdown-item" onclick="window.location.href='profile.html'">👤 My Profile</div>
            <div class="dropdown-divider"></div>
            <div class="dropdown-item danger" onclick="Auth.logout()">🚪 Sign Out</div>
          </div>
        </div>
      </div>
    </header>

    <main id="page-content">
      <div id="dash-content">
        <div class="page-loader"><div class="spinner"></div> Loading</div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/api.js?v=7"></script>
<script src="../assets/js/app.js?v=7"></script>
<script>
(async () => {
  const ok = await requireAuth();
  if (!ok) return;

  Sidebar.setActive('dashboard.html');

  const isAdmin    = Auth.hasAnyRole(['SYSTEM_ADMIN', 'ACCOUNTS_OFFICER']);
  const isApprover = Auth.isApprover();

  const [geRes, tasksRes, notifsRes, reportsRes] = await Promise.allSettled([
    API.geList({ limit: 10 }),
    isApprover ? API.myTasks() : Promise.resolve({ tasks: [] }),
    API.notifications(),
    isAdmin    ? API.reports() : Promise.resolve(null),
  ]);

  const ges     = geRes.status      === 'fulfilled' ? geRes.value.data              : [];
  const tasks   = tasksRes.status   === 'fulfilled' ? tasksRes.value.tasks           : [];
  const notifs  = notifsRes.status  === 'fulfilled' ? notifsRes.value.notifications  : [];
  const reports = reportsRes.status === 'fulfilled' ? reportsRes.value              : null;

  const unread = notifs.filter(n => !n.is_read);
  if (unread.length) {
    document.querySelectorAll('.notif-badge').forEach(b => {
      b.textContent = unread.length;
      b.classList.remove('hidden');
    });
  }

  const notifList = document.getElementById('notif-preview-list');
  if (notifList) {
    notifList.innerHTML = unread.slice(0, 5).map(n => `
      <div class="dropdown-item" style="align-items:flex-start;flex-direction:column;gap:2px">
        <div style="font-size:12px;font-weight:600">${n.ge_number ? n.ge_number + ' — ' : ''}${n.type.replace(/_/g,' ')}</div>
        <div style="font-size:11px;color:var(--text-muted)">${(n.message||'').substring(0,80)}</div>
      </div>`).join('') ||
      '<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:13px">No new notifications</div>';
  }

  if (tasks.length) {
    document.querySelectorAll('#pending-approvals-badge').forEach(b => {
      b.textContent = tasks.length;
      b.classList.remove('hidden');
    });
  }

  const byStatus = reports?.by_status || {};
  const totalGEs = reports
    ? Object.values(byStatus).reduce((s,v) => s + v.count, 0)
    : ges.length;
  const totalAmt = reports
    ? Object.values(byStatus).reduce((s,v) => s + (v.total||0), 0)
    : ges.reduce((s,g) => s + parseFloat(g.total_amount||0), 0);
  const completed = byStatus.COMPLETED?.count ?? ges.filter(g => g.status==='COMPLETED').length;
  const drafts    = byStatus.DRAFT?.count     ?? ges.filter(g => g.status==='DRAFT').length;
  const pending   = reports
    ? Object.entries(byStatus).filter(([k]) => k.startsWith('PENDING')).reduce((s,[,v])=>s+v.count,0)
    : ges.filter(g => g.status.startsWith('PENDING')).length;

  const container = document.getElementById('dash-content');
  const now = new Date();
  const dayFull = now.toLocaleDateString('en-PG', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const dayNum  = now.getDate();

  container.innerHTML = `
    <div class="dash-welcome">
      <img src="../assets/img/pnguot-logo.jpg" alt="PNGUOT">
      <div class="dash-welcome-text">
        <h2>Welcome back, ${Auth.user?.first_name || 'User'} 👋</h2>
        <p>Papua New Guinea University of Technology — General Expense Monitoring System</p>
      </div>
      <div class="dash-welcome-date">
        <div class="date-day">${dayNum}</div>
        <div class="date-full">${dayFull}</div>
      </div>
    </div>

    <div class="stat-grid" style="margin-bottom:24px">
      <div class="stat-card sc-blue">
        <div class="stat-icon">📄</div>
        <div class="stat-label">${isAdmin ? 'Total GE Forms' : 'My GE Forms'}</div>
        <div class="stat-value">${totalGEs}</div>
        <div class="stat-sub">All time</div>
      </div>
      <div class="stat-card sc-orange">
        <div class="stat-icon">⏳</div>
        <div class="stat-label">Pending Approval</div>
        <div class="stat-value">${pending}</div>
        <div class="stat-sub">In workflow</div>
      </div>
      <div class="stat-card sc-green">
        <div class="stat-icon">✅</div>
        <div class="stat-label">Completed</div>
        <div class="stat-value">${completed}</div>
        <div class="stat-sub">Fully approved</div>
      </div>
      <div class="stat-card sc-yellow">
        <div class="stat-icon">📝</div>
        <div class="stat-label">Drafts</div>
        <div class="stat-value">${drafts}</div>
        <div class="stat-sub">Not yet submitted</div>
      </div>
      <div class="stat-card sc-purple">
        <div class="stat-icon">💰</div>
        <div class="stat-label">Total Value</div>
        <div class="stat-value" style="font-size:18px">${Fmt.currency(totalAmt)}</div>
        <div class="stat-sub">${isAdmin ? 'All GEs' : 'My GEs'}</div>
      </div>
      ${tasks.length ? `
      <div class="stat-card sc-orange" style="cursor:pointer" onclick="location.href='approvals.html'">
        <div class="stat-icon">🔔</div>
        <div class="stat-label">My Pending Tasks</div>
        <div class="stat-value">${tasks.length}</div>
        <div class="stat-sub" style="color:#f97316">Action required →</div>
      </div>` : ''}
    </div>

    <div class="dash-section-title">Quick Actions</div>
    <div class="quick-actions" style="margin-bottom:24px">
      <a href="ge-form.html"           class="qa-btn primary">➕ New GE Form</a>
      <a href="my-ges.html"            class="qa-btn ghost">📋 My GE Forms</a>
      <a href="quotation-tracker.html" class="qa-btn ghost">📊 Quotation Tracker</a>
      <a href="my-reports.html"        class="qa-btn ghost">📈 Reports</a>
      ${isApprover ? `<a href="approvals.html" class="qa-btn ghost">✅ Pending Approvals</a>` : ''}
    </div>

    <div class="dash-section-title">Activity</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Recent GE Forms</span>
          <a href="my-ges.html" class="btn btn-ghost btn-sm">View All →</a>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>GE Number</th><th>Payee</th><th>Amount</th><th>Status</th></tr></thead>
            <tbody>
              ${(reports?.recent_ges || ges).slice(0,8).map(g => `
                <tr style="cursor:pointer" onclick="location.href='my-ges.html'">
                  <td class="font-mono fw-600">${g.ge_number||''}</td>
                  <td>${g.payee_name||''}</td>
                  <td class="fw-600">${Fmt.currency(g.total_amount)}</td>
                  <td>${statusBadge(g.status, g.status_label||g.status)}</td>
                </tr>`).join('') ||
              '<tr><td colspan="4" class="text-center text-muted">No GEs yet</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">${isAdmin ? 'By Department' : 'My Recent Activity'}</span>
        </div>
        <div class="table-wrap">
          <table>
            ${isAdmin && reports?.by_department?.length ? `
              <thead><tr><th>Department</th><th class="text-right">GEs</th><th class="text-right">Total</th></tr></thead>
              <tbody>
                ${reports.by_department.map(d => `
                  <tr>
                    <td>${d.department}</td>
                    <td class="text-right">${d.ge_count}</td>
                    <td class="text-right fw-600">${Fmt.currency(d.total_amount)}</td>
                  </tr>`).join('')}
              </tbody>` : `
              <thead><tr><th>GE Number</th><th>Status</th><th class="text-right">Amount</th></tr></thead>
              <tbody>
                ${ges.slice(0,8).map(g => `
                  <tr>
                    <td class="font-mono" style="font-size:12px">${g.ge_number||''}</td>
                    <td>${statusBadge(g.status, g.status_label||g.status)}</td>
                    <td class="text-right fw-600">${Fmt.currency(g.total_amount)}</td>
                  </tr>`).join('') ||
                '<tr><td colspan="3" class="text-center text-muted">No GEs yet</td></tr>'}
              </tbody>`}
          </table>
        </div>
      </div>
    </div>`;
})();
</script>
</body>
</html>
